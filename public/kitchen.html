<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kitchen Touch Screen (KDS)</title>
  <script src="/socket.io/socket.io.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Kantumruy Pro', sans-serif; background: #1e293b; color: white; padding: 20px; }
    h1 { text-align: center; color: #38bdf8; }
    .orders-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-top: 20px; }
    .order-card { background: #334155; border-left: 8px solid #f59e0b; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    .order-card h2 { margin-top: 0; color: #fbbf24; }
    .btn-done { width: 100%; padding: 15px; font-size: 18px; font-weight: bold; background: #10b981; color: white; border: none; border-radius: 8px; cursor: pointer; margin-top: 15px; font-family: inherit; }
    .btn-done:active { background: #059669; }
    .alert-banner { background: #ef4444; color: white; padding: 12px; text-align: center; border-radius: 8px; display: none; font-weight: bold; margin-bottom: 15px; font-size: 18px; }
  </style>
</head>
<body>

  <h1>👨‍🍳 អេក្រង់ផ្ទះបាយ (Kitchen Touch Screen)</h1>
  <div id="alertBanner" class="alert-banner">🔔 មានការបញ្ជាទិញថ្មីចូលមកហើយ!</div>
  <div class="orders-grid" id="ordersContainer"></div>

  <script>
    const socket = io();
    const ordersContainer = document.getElementById('ordersContainer');
    const alertBanner = document.getElementById('alertBanner');

    function playAlertSound() {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, ctx.currentTime);
      osc.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.5);
    }

    socket.on('new_paid_order_to_kitchen', (order) => {
      playAlertSound();
      alertBanner.style.display = 'block';
      setTimeout(() => { alertBanner.style.display = 'none'; }, 5000);

      const card = document.createElement('div');
      card.className = 'order-card';
      card.id = `order-${order.id}`;
      card.innerHTML = `
        <h2>Order #${order.id}</h2>
        <p><strong>អតិថិជន៖</strong> ${order.customer_name}</p>
        <p><strong>លេខទូរស័ព្ទ៖</strong> ${order.customer_phone}</p>
        <p><strong>ទីតាំង៖</strong> ${order.delivery_address}</p>
        <p><strong>តម្លៃសរុប៖</strong> $${order.total_amount}</p>
        <button class="btn-done" onclick="markAsDone(${order.id})">✅ ចម្អិនរួចរាល់ (DONE)</button>
      `;
      ordersContainer.prepend(card);
    });

    async function markAsDone(orderId) {
      await fetch(`/api/kitchen/done/${orderId}`, { method: 'POST' });
      const card = document.getElementById(`order-${orderId}`);
      if (card) card.remove();
      alert(`បានជូនដំណឹងទៅក្រុមការងារដឹកជញ្ជូន និងភ្ញៀវសម្រាប់ Order #${orderId} រួចរាល់!`);
    }
  </script>

</body>
</html>
